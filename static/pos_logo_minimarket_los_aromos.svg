<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Minimarket Los Aromos">
  <defs>
    <linearGradient id="la-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="100%" stop-color="#021510"/>
    </linearGradient>
    <linearGradient id="la-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="la-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#la-bg)" stroke="#065f46" stroke-width="2"/>
  
  <!-- Outer organic grocery badge -->
  <circle cx="100" cy="86" r="54" fill="none" stroke="url(#la-green)" stroke-width="3" stroke-dasharray="8 4"/>
  
  <!-- Grocery Market Bag + Fresh Leaves Icon -->
  <g transform="translate(100, 84)">
    <!-- Modern Market Basket / Bag -->
    <path d="M-32,-6 L32,-6 L24,36 L-24,36 Z" fill="rgba(16, 185, 129, 0.15)" stroke="url(#la-green)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-18,-6 C-18,-28 18,-28 18,-6" fill="none" stroke="url(#la-accent)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Stylized Wheat / Leaf Emblem inside -->
    <path d="M0,8 C-12,18 0,30 0,30 C0,30 12,18 0,8 Z" fill="url(#la-green)"/>
    <circle cx="-10" cy="12" r="4" fill="url(#la-accent)"/>
    <circle cx="10" cy="12" r="4" fill="url(#la-accent)"/>
    <circle cx="0" cy="0" r="4" fill="url(#la-accent)"/>
  </g>
  
  <!-- Text Brand -->
  <text x="100" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="1.2" fill="#ecfdf5">LOS AROMOS</text>
  <text x="100" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="#34d399">MINIMARKET</text>
</svg>
