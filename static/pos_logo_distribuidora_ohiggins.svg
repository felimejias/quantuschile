<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Distribuidora O'Higgins">
  <defs>
    <linearGradient id="doh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1938"/>
      <stop offset="100%" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="doh-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="doh-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#doh-bg)" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Andean Mountain Logistics & Dynamic Distribution Arrows -->
  <g transform="translate(100, 84)">
    <!-- Mountain Background Peak -->
    <polygon points="0,-42 38,28 -38,28" fill="rgba(37, 99, 235, 0.2)" stroke="url(#doh-blue)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Forward Fast Supply Chain Arrow Paths -->
    <path d="M-28,14 L0,-24 L28,14" fill="none" stroke="url(#doh-cyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-18,26 L0,2 L18,26" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Horizon speed lines -->
    <line x1="-42" y1="28" x2="42" y2="28" stroke="url(#doh-blue)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text Brand -->
  <text x="100" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="900" letter-spacing="1" fill="#f8fafc">O'HIGGINS</text>
  <text x="100" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="#38bdf8">DISTRIBUIDORA MAYORISTA</text>
</svg>
