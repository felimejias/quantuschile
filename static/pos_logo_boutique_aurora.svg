<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Boutique Aurora">
  <defs>
    <linearGradient id="ba-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e112a"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="ba-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ba-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#ba-bg)" stroke="#4c1d95" stroke-width="2"/>
  
  <!-- Geometric Luxury Diamond Monogram BA -->
  <g transform="translate(100, 82)">
    <!-- Outer Diamond Frame -->
    <polygon points="0,-48 44,0 0,48 -44,0" fill="none" stroke="url(#ba-gold)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,-38 34,0 0,38 -34,0" fill="rgba(192, 132, 252, 0.08)" stroke="url(#ba-rose)" stroke-width="1.5"/>
    
    <!-- Monogram Monoline 'A' with crown tip -->
    <path d="M-18,24 L0,-24 L18,24" fill="none" stroke="url(#ba-gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-11,8 L11,8" stroke="url(#ba-gold)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Star sparkle at apex -->
    <path d="M0,-30 L2,-24 L8,-22 L2,-20 L0,-14 L-2,-20 L-8,-22 L-2,-24 Z" fill="url(#ba-gold)"/>
  </g>
  
  <!-- Text Brand -->
  <text x="100" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#fdf4ff">AURORA</text>
  <text x="100" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#fbbf24">HAUTE BOUTIQUE</text>
</svg>
